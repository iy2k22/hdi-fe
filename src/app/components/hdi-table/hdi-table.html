<table class="mx-auto w-100">
    <col style="width: 70%" />
    <col style="width: 30%" />
    @for (cnt of data(); track cnt.name) {
    <tr>
        <td class="text-start">
            <span [innerHTML]="cnt.flag"></span>
            {{ cnt.name }}
        </td>
        <td class="text-end">
        @if (cnt.score !== -1) {
            {{ cnt.score.toFixed(round()) }}
        } @else {
            -.---
        }
        </td>
    </tr>
    }
</table>
